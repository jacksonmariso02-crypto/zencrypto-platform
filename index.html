<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>ZenCrypto | Digital Asset Trading</title>
    <meta name="description" content="ZenCrypto digital asset trading platform prototype" />
    <style>
      html, body, #root { min-height: 100%; background: #0b1220 !important; }
      body { margin: 0; color: #e8eef8; }
      /* The supercar is a hero illustration, never a full-screen app background. */
      body::before { content: none !important; display: none !important; }
      .boot-screen {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
        box-sizing: border-box; background: #0b1220; color: #e8eef8;
        font: 15px/1.6 Inter, Arial, sans-serif;
      }
      .boot-card {
        width: min(560px, 100%); padding: 28px; box-sizing: border-box;
        border: 1px solid #26364e; border-radius: 16px; background: #111c30;
      }
      .boot-card h1 { margin: 0 0 8px; font-size: 22px; }
      .boot-card p { margin: 0; color: #aabbd0; }
      .boot-error { margin-top: 14px !important; color: #fda4af !important; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <h1>ZenCrypto is starting…</h1>
          <p>If this message remains visible, the application script did not finish loading. The page will show a diagnostic instead of leaving a full-screen background image.</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot-screen"><div class="boot-card"><h1>JavaScript is required</h1><p>Please enable JavaScript to use the ZenCrypto interface.</p></div></div>
    </noscript>
    <script>
      (function () {
        var timer;
        function showStartupDiagnostic(message) {
          var root = document.getElementById("root");
          if (!root || root.querySelector(".app") || root.querySelector(".boot-error")) return;
          root.innerHTML = "";
          var screen = document.createElement("div");
          screen.className = "boot-screen";
          var card = document.createElement("div");
          card.className = "boot-card";
          var title = document.createElement("h1");
          title.textContent = "ZenCrypto could not load";
          var detail = document.createElement("p");
          detail.className = "boot-error";
          detail.textContent = String(message || "The application did not mount.");
          var hint = document.createElement("p");
          hint.textContent = "Open GitHub Actions and check the latest deployment build. If the problem continues, send this message to support.";
          card.appendChild(title); card.appendChild(detail); card.appendChild(hint);
          screen.appendChild(card); root.appendChild(screen);
        }
        window.addEventListener("error", function (event) {
          if (event && event.message) showStartupDiagnostic(event.message);
          else if (event && event.target && event.target.src) showStartupDiagnostic("Failed to load resource: " + event.target.src);
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          showStartupDiagnostic(event && event.reason ? (event.reason.message || event.reason) : "Unhandled promise rejection");
        });
        timer = window.setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.querySelector(".app")) showStartupDiagnostic("The React application did not mount within 12 seconds. Check the deployment build and browser Console.");
        }, 12000);
        window.addEventListener("DOMContentLoaded", function () {
          window.setTimeout(function () { window.clearTimeout(timer); }, 15000);
        });
      })();
    </script>ipt>
    <script type="module" src="/src.jsx"></script>
  </body>
</html>
