
name: Deploy ZenCrypto to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src.jsx'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'public/**'
      - 'render.yaml'
      - 'backend/**'
      - 'exchange-service/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/paper-trading-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          VITE_API_BASE_URL: https://zencrypto-api.onrender.com
          VITE_EXCHANGE_API_BASE_URL: ${{ vars.EXCHANGE_API_BASE_URL || 'https://zencrypto-exchange.onrender.com' }}
        run: npm run build

      - name: Verify production API URLs in built assets
        run: |
          grep -R -q 'https://zencrypto-api.onrender.com' dist/assets
          grep -R -q 'https://zencrypto-exchange.onrender.com' dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify published frontend
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 https://jacksonmariso02-crypto.github.io/zencrypto-platform/ -o /tmp/zencrypto-index.html
          grep -q 'ZenCrypto' /tmp/zencrypto-index.html
      - name: Verify platform API health and legacy paper API retirement
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 https://zencrypto-api.onrender.com/health -o /tmp/zencrypto-health.json
          python -c "import json; d=json.load(open('/tmp/zencrypto-health.json')); assert d.get('status') == 'ok'; assert d.get('mode') == 'ACCOUNT_LINK_ONLY'; assert d.get('legacy_paper_trading_enabled') is False; assert d.get('live_funds_enabled') is False; assert d.get('real_deposits_enabled') is False; assert d.get('real_withdrawals_enabled') is False"
          status=$(curl --silent --show-error --output /tmp/zencrypto-paper-retired.json --write-out '%{http_code}' https://zencrypto-api.onrender.com/trade/assets)
          test "$status" = "410"
