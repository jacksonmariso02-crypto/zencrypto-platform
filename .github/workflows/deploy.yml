
name: Deploy ZenCrypto to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src.jsx'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'public/**'
      - 'render.yaml'
      - 'backend/**'
      - 'exchange-service/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/paper-trading-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          VITE_API_BASE_URL: https://zencrypto-api.onrender.com
          VITE_EXCHANGE_API_BASE_URL: https://zencrypto-exchange.onrender.com
        run: npm run build

      - name: Verify production API URLs in built assets
        run: |
          grep -R -q 'https://zencrypto-api.onrender.com' dist/assets
          grep -R -q 'https://zencrypto-exchange.onrender.com' dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify published frontend
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 https://jacksonmariso02-crypto.github.io/zencrypto-platform/ -o /tmp/zencrypto-index.html
          grep -q 'ZenCrypto' /tmp/zencrypto-index.html
      - name: Verify platform API health and legacy paper API retirement
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 https://zencrypto-api.onrender.com/health -o /tmp/zencrypto-health.json
          python -c "import json; d=json.load(open('/tmp/zencrypto-health.json')); assert d.get('status') == 'ok'; assert d.get('mode') == 'ACCOUNT_LINK_ONLY'; assert d.get('legacy_paper_trading_enabled') is False; assert d.get('live_funds_enabled') is False; assert d.get('real_deposits_enabled') is False; assert d.get('real_withdrawals_enabled') is False"
          status=$(curl --silent --show-error --output /tmp/zencrypto-paper-retired.json --write-out '%{http_code}' https://zencrypto-api.onrender.com/trade/assets)
          test "$status" = "410"
      - name: Verify exchange service deployment, vault readiness and live-order lock
        env:
          EXCHANGE_BASE_URL: https://zencrypto-exchange.onrender.com
        run: |
          health_status=$(curl --silent --show-error --output /tmp/zencrypto-exchange-health.json --write-out '%{http_code}' --location "$EXCHANGE_BASE_URL/health")
          if [ "$health_status" != "200" ]; then
            echo "::error::Exchange service /health returned HTTP $health_status. Confirm the zencrypto-exchange Render service exists, is linked to this repository, and has completed its deployment from the current main branch."
            cat /tmp/zencrypto-exchange-health.json || true
            exit 1
          fi
          python -c "import json; d=json.load(open('/tmp/zencrypto-exchange-health.json')); assert d.get('status') == 'ok'; assert d.get('exchange') == 'binance'; assert d.get('sandbox') is True; assert d.get('live_trading_enabled') is False; assert d.get('customer_order_routing_enabled') is False; assert d.get('customer_credential_vault_configured') is True; print('Exchange service build revision:', d.get('build_revision'))"
          ready_status=$(curl --silent --show-error --output /tmp/zencrypto-exchange-ready.json --write-out '%{http_code}' --location "$EXCHANGE_BASE_URL/ready")
          if [ "$ready_status" != "200" ]; then
            echo "::error::Exchange service /ready returned HTTP $ready_status. A 404 usually means Render is serving an older/different service or the Blueprint service has not been created/synced; a 503 means inspect the readiness checks below."
            cat /tmp/zencrypto-exchange-ready.json || true
            exit 1
          fi
          python -c "import json; d=json.load(open('/tmp/zencrypto-exchange-ready.json')); assert d.get('status') == 'ready'; assert d.get('sandbox') is True; assert d.get('live_trading_enabled') is False; assert d.get('checks', {}).get('customer_credential_vault') is True"
          curl --fail --silent --show-error --location "$EXCHANGE_BASE_URL/api/v1/market-data/status" -o /tmp/zencrypto-market-status.json
          python -c "import json; d=json.load(open('/tmp/zencrypto-market-status.json')); assert d.get('sandbox') is True; assert d.get('live_order_placement_enabled') is False; assert d.get('customer_order_routing_enabled') is False; assert d.get('customer_account_linking_enabled') is True; assert d.get('credential_vault_configured') is True"
      - name: Verify browser CORS preflight from production frontend
        run: |
          status=$(curl --silent --show-error --output /tmp/zencrypto-preflight.txt --write-out '%{http_code}' --request OPTIONS https://zencrypto-api.onrender.com/auth/login --header 'Origin: https://jacksonmariso02-crypto.github.io' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key')
          test "$status" = "200"
          grep -qi 'access-control-allow-origin: https://jacksonmariso02-crypto.github.io' <(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS https://zencrypto-api.onrender.com/auth/login --header 'Origin: https://jacksonmariso02-crypto.github.io' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: authorization,content-type,idempotency-key')
