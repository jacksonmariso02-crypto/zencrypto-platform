name: Exchange Service Tests

on:
  push:
    branches: [main]
    paths:
      - 'exchange-service/**'
      - '.github/workflows/exchange-service-tests.yml'
  pull_request:
    paths:
      - 'exchange-service/**'
      - '.github/workflows/exchange-service-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: exchange-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
