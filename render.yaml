services:
  - type: web
    name: zencrypto-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: zencrypto-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/zencrypto.db
      - key: APP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jacksonmariso02-crypto.github.io
